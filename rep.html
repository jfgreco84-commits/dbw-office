<!DOCTYPE html>

<title>DBW Rep Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0f1117;color:#e0e6f0;min-height:100vh}
header{background:linear-gradient(135deg,#1a1f2e,#0d1520);border-bottom:2px solid #f5a623;padding:16px 20px;display:flex;align-items:center;gap:16px}
.logo{font-size:22px;font-weight:900;color:#f5a623;letter-spacing:2px}
.rep-name{font-size:20px;font-weight:700;color:#fff}
.rep-meta{font-size:12px;color:#8892a4;margin-top:2px}
.container{max-width:960px;margin:0 auto;padding:20px 16px}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.hero-card{background:#1a1f2e;border:1px solid #2a3040;border-radius:10px;padding:16px;text-align:center}
.hero-card .label{font-size:11px;color:#8892a4;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.hero-card .value{font-size:22px;font-weight:800;color:#f5a623}
.hero-card .sub{font-size:11px;color:#6b7585;margin-top:4px}
.section-title{font-size:13px;font-weight:700;color:#f5a623;text-transform:uppercase;letter-spacing:2px;margin:24px 0 12px;padding-bottom:6px;border-bottom:1px solid #2a3040}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#1a1f2e;color:#8892a4;text-align:right;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:1px}
th:first-child{text-align:left}
td{padding:8px 10px;border-bottom:1px solid #1a1f2e;text-align:right}
td:first-child{text-align:left;color:#c8d0de}
tr:hover td{background:#1a2030}
.mu-chip{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700}
.mu-hi{background:#1a3a1a;color:#4caf7d}
.mu-mid{background:#3a2a10;color:#f5a623}
.mu-lo{background:#3a1a1a;color:#e05555}
.period-card{background:#1a1f2e;border:1px solid #2a3040;border-radius:10px;margin-bottom:16px;overflow:hidden}
.period-header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;background:#1e2435}
.period-header:hover{background:#232a3e}
.period-payday{font-weight:700;color:#fff;font-size:14px}
.period-gross{font-size:20px;font-weight:800;color:#f5a623}
.period-body{padding:0 16px 16px;display:none}
.period-body.open{display:block}
.daily-table{margin-top:12px}
.daily-table td,.daily-table th{font-size:12px;padding:6px 8px}
.return-row td{color:#e05555}
.total-row td{font-weight:700;color:#fff;border-top:1px solid #3a4050;padding-top:10px}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700;background:#f5a623;color:#000;margin-left:8px}
.toggle-hint{font-size:11px;color:#5a6375;margin-left:8px}
.no-data{color:#5a6375;font-style:italic;font-size:13px;padding:12px 0}
</style>

function $(id){return document.getElementById(id)}
function fmt$(n){return n==null?'—':'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtPct(n){return n==null?'—':n.toFixed(1)+'%'}
function muClass(mu){return mu>=1.8?'mu-hi':mu>=1.6?'mu-mid':'mu-lo'}

// Get rep ID from URL
const params = new URLSearchParams(location.search);
const repId = params.get('id') || params.get('rep');
const rep = D.roster[repId];

if(!rep){
  document.body.innerHTML='<div style="padding:40px;text-align:center;color:#e05555;font-size:20px">Rep not found. Check the URL.</div>';
  throw new Error('no rep');
}

$('rep-name').textContent = rep.name + (rep.nick ? ' "'+rep.nick+'"' : '');
$('rep-meta').textContent = repId + ' · ' + (rep.scale==='veteran'?'Veteran':'New Guy') + ' Commission Scale · 2026 YTD';
document.title = rep.name + ' — DBW Dashboard';

const ytd = D.ytd[repId] || {};
const commYtd = D.comm_ytd[repId] || 0;
const mu = ytd.mu || 0;

// Hero cards
const heroes = [
  {label:'YTD Net Sales', value:fmt$(ytd.net_sales), sub:'Gross: '+fmt$(ytd.sales)},
  {label:'YTD Commission', value:fmt$(commYtd), sub:''},
  {label:'Avg M/U', value:mu.toFixed(3), sub:''},
  {label:'YTD Gross Profit', value:fmt$(ytd.gross_profit), sub:''},
  {label:'YTD Returns', value:fmt$(ytd.returns||0), sub:''},
];
$('hero').innerHTML = heroes.map(h=>`<div class="hero-card"><div class="label">${h.label}</div><div class="value">${h.value}</div>${h.sub?'<div class="sub">'+h.sub+'</div>':''}</div>`).join('');

// Monthly
const months = D.months;
const monthNames = D.month_names;
const monthData = {};
(D.monthly||[]).filter(r=>r.rep_id===repId).forEach(r=>{monthData[r.month]=r;});
let mBody = '';
let totSales=0,totCogs=0,totGP=0,totRet=0;
months.forEach(m=>{
  const r=monthData[m];
  if(!r){mBody+=`<tr><td>${monthNames[m]}</td><td colspan="5" class="no-data">—</td></tr>`;return;}
  totSales+=r.net_sales||0;totCogs+=r.cogs||0;totGP+=(r.net_sales-r.cogs)||0;totRet+=r.returns||0;
  const gp=r.net_sales-r.cogs;
  const mu=r.cogs>0?r.net_sales/r.cogs:0;
  mBody+=`<tr>
    <td>${monthNames[m]}</td>
    <td>${fmt$(r.net_sales)}</td>
    <td>${fmt$(r.cogs)}</td>
    <td>${fmt$(gp)}</td>
    <td><span class="mu-chip ${muClass(mu)}">${mu.toFixed(3)}</span></td>
    <td style="color:#e05555">${r.returns?fmt$(r.returns):'—'}</td>
  </tr>`;
});
mBody+=`<tr style="font-weight:700;color:#fff;border-top:1px solid #3a4050">
  <td>TOTAL</td><td>${fmt$(totSales)}</td><td>${fmt$(totCogs)}</td><td>${fmt$(totGP)}</td><td>—</td><td style="color:#e05555">${fmt$(totRet)}</td>
</tr>`;
$('monthly-body').innerHTML=mBody;

// Pay periods
const payroll = {};
(D.payroll||[]).filter(r=>r.rep_id===repId).forEach(r=>{payroll[r.payday]=r;});
let html='';
D.pay_periods.forEach(pd=>{
  const pr=payroll[pd];
  const gross=pr?pr.gross_commission:null;
  const gt=pr?pr.grand_total:null;
  const returns=pr?pr.returns:null;
  html+=`<div class="period-card">
  <div class="period-header" onclick="toggle(this)">
    <div><span class="period-payday">Payday: ${pd}</span><span class="toggle-hint">▼ tap to expand</span></div>
    <div class="period-gross">${gt!=null?fmt$(gt):'—'}</div>
  </div>
  <div class="period-body">`;
  if(!pr){html+='<p class="no-data">No payroll data for this period.</p>';}
  else{
    // daily rows
    const daily=pr.daily||[];
    if(daily.length){
      html+=`<table class="daily-table"><thead><tr><th style="text-align:left">Date</th><th>Commission</th></tr></thead><tbody>`;
      daily.forEach(d=>{
        html+=`<tr><td>${d.date}</td><td>${fmt$(d.commission)}</td></tr>`;
      });
      html+=`</tbody></table>`;
    }
    // returns
    if(returns && returns.length){
      html+=`<div style="margin-top:12px;font-size:12px;color:#e05555;font-weight:700">RETURNS / DEDUCTIONS</div>`;
      html+=`<table class="daily-table"><thead><tr><th style="text-align:left">Cust</th><th style="text-align:left">Inv#</th><th>Amount</th></tr></thead><tbody>`;
      returns.forEach(r=>{
        html+=`<tr class="return-row"><td>${r.cust||''}</td><td>${r.inv||''}</td><td>${fmt$(r.amount)}</td></tr>`;
      });
      html+=`</tbody></table>`;
    }
    html+=`<table class="daily-table"><tbody>
      <tr class="total-row"><td>Gross Commission</td><td>${fmt$(pr.gross_commission)}</td></tr>
      ${returns&&returns.length?'<tr class="total-row" style="color:#e05555"><td>Returns</td><td>'+fmt$(pr.returns.reduce?pr.returns.reduce((a,r)=>a+(r.amount||0),0):pr.returns)+'</td></tr>':''}
      <tr class="total-row" style="color:#4caf7d"><td>Grand Total Earned</td><td>${fmt$(pr.grand_total)}</td></tr>
    </tbody></table>`;
  }
  html+=`</div></div>`;
});
$('periods').innerHTML=html||'<p class="no-data">No pay period data found.</p>';

function toggle(el){
  const body=el.nextElementSibling;
  body.classList.toggle('open');
  el.querySelector('.toggle-hint').textContent=body.classList.contains('open')?'▲ collapse':'▼ tap to expand';
}
</script>
</body>
</html>
