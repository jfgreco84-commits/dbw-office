<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DBW Rep Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0f1117;color:#e0e6f0;min-height:100vh}
header{background:linear-gradient(135deg,#1a1f2e,#0d1520);border-bottom:2px solid #f5a623;padding:16px 20px;display:flex;align-items:center;gap:16px}
.logo{font-size:22px;font-weight:900;color:#f5a623;letter-spacing:2px}
.rep-name{font-size:20px;font-weight:700;color:#fff}
.rep-meta{font-size:12px;color:#8892a4;margin-top:2px}
.container{max-width:960px;margin:0 auto;padding:20px 16px}
.hero{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:24px}
.hero-card{background:#1a1f2e;border:1px solid #2a3040;border-radius:10px;padding:18px 16px;text-align:center}
.hero-card .label{font-size:11px;color:#8892a4;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.hero-card .value{font-size:22px;font-weight:800;color:#f5a623}
.hero-card .sub{font-size:11px;color:#6b7585;margin-top:4px}
.hero-card.green .value{color:#4caf7d}
.hero-card.red .value{color:#e05555}
.hero-card.blue .value{color:#4a9eff}
.hero-card.primary{grid-column:span 3;padding:26px 22px}
.hero-card.primary .value{font-size:34px;font-weight:900}
.hero-card.primary .label{font-size:12px}
.hero-card.secondary{padding:13px 12px}
.hero-card.secondary .value{font-size:16px;font-weight:700}
.hero-card.secondary .label{font-size:10px}
.hero-card.secondary .sub{font-size:10px}
@media(max-width:600px){.hero{grid-template-columns:repeat(2,1fr)}.hero-card.primary{grid-column:span 2}.hero-card.secondary{grid-column:span 1}}
.section-title{font-size:13px;font-weight:700;color:#f5a623;text-transform:uppercase;letter-spacing:2px;margin:28px 0 14px;padding-bottom:8px;border-bottom:1px solid #2a3040}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#1a1f2e;color:#8892a4;text-align:right;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:1px}
th:first-child{text-align:left}
td{padding:8px 10px;border-bottom:1px solid #1a1f2e;text-align:right}
td:first-child{text-align:left;color:#c8d0de}
tr:hover td{background:#1a2030}
.total-tr td{font-weight:700;color:#fff;border-top:2px solid #3a4050;background:#1a1f2e}
.mu-chip{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700}
.mu-hi{background:#1a3a1a;color:#4caf7d}
.mu-mid{background:#3a2a10;color:#f5a623}
.mu-lo{background:#3a1a1a;color:#e05555}
.period-card{background:#1a1f2e;border:1px solid #2a3040;border-radius:10px;margin-bottom:14px;overflow:hidden}
.period-header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;background:#1e2435}
.period-header:hover{background:#232a3e}
.period-payday{font-weight:800;color:#fff;font-size:15px;margin-right:12px}
.period-earned{font-size:22px;font-weight:800;color:#4caf7d}
.period-body{padding:12px 16px 16px;display:none}
.period-body.open{display:block}
table.inner{font-size:12px;margin-top:8px}
table.inner th{font-size:10px;padding:5px 8px}
table.inner td{padding:5px 8px;border-bottom:1px solid #141820}
.sec-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#8892a4;margin:12px 0 4px;padding-bottom:3px;border-bottom:1px solid #2a3040}
.tag{display:inline-block;padding:1px 7px;border-radius:8px;font-size:10px;font-weight:700;margin-right:4px}
.tag-ret{background:#3a1a1a;color:#e05555}
.tag-adj{background:#1a2a3a;color:#4a9eff}
.tag-hold{background:#3a2a10;color:#f5a623}
.tag-chew{background:#2a1a3a;color:#b88aff}
.tag-pos{background:#1a3a1a;color:#4caf7d}
.no-data{color:#5a6375;font-style:italic;font-size:12px;padding:8px 0}
.hint{font-size:11px;color:#5a6375;margin-left:8px}
.summary-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1e2435;font-size:13px}
.summary-row:last-child{border:none;font-weight:700;color:#fff;padding-top:10px}

#bonus-section{background:linear-gradient(135deg,#1a1f2e,#12172a);border:1px solid #f5a623;border-radius:12px;padding:20px;margin-bottom:24px}
.bonus-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.bonus-month{font-size:16px;font-weight:900;color:#f5a623;letter-spacing:1px}
.bonus-days-badge{background:#f5a62333;border:1px solid #f5a623;border-radius:20px;padding:5px 16px;font-size:14px;color:#f5a623;font-weight:900;letter-spacing:.5px}
.bonus-bar-wrap{background:#2a3040;border-radius:6px;height:14px;position:relative;margin-bottom:16px;overflow:hidden}
.bonus-bar-fill{background:linear-gradient(90deg,#f5a623,#ff6b35);height:100%;border-radius:6px}
.bonus-bar-text{position:absolute;top:0;left:0;right:0;text-align:center;font-size:10px;line-height:14px;color:#fff;font-weight:700;text-shadow:0 1px 2px #000}
.bonus-tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.bonus-tier{background:#1e2535;border-radius:8px;padding:14px}
.bt-label{font-size:11px;font-weight:800;letter-spacing:1px;margin-bottom:6px}
.bt-threshold{font-size:13px;color:#c8d0e0;margin-bottom:4px}
.bt-pace{font-size:12px;color:#8892a4;margin-bottom:4px}
.bt-earn{font-size:16px;font-weight:900;margin-top:6px}
.bonus-mu{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.mu-pill{font-size:11px;padding:3px 10px;border-radius:12px;font-weight:700}
.mu-pill.gain{background:#1a3a2a;color:#4caf7d;border:1px solid #4caf7d44}
.mu-pill.lose{background:#3a1a1a;color:#e05555;border:1px solid #e0555544}
.mu-pill.dead{background:#2a2010;color:#f5a623;border:1px solid #f5a62344}
.bonus-atr{font-size:12px;color:#8892a4;margin-top:2px}
.bonus-atr strong{color:#f5a623}

.gsm-section{margin-top:40px;padding-top:24px;border-top:1px solid #2a3040}
.gsm-title{font-size:12px;font-weight:700;color:#8892a4;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px}
.gsm-main-title{font-size:13px;font-weight:800;color:#f5a623;text-transform:uppercase;letter-spacing:2px;margin-bottom:16px}
.gsm-card{background:#1a1f2e;border:1px solid #2a3040;border-radius:8px;padding:12px;text-align:center}
.gsm-card .gc-label{font-size:10px;color:#8892a4;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.gsm-card .gc-value{font-size:19px;font-weight:900;margin:4px 0}
.gsm-card .gc-sub{font-size:10px;color:#5a6375;margin-top:2px}
.gsm-card.gc-green .gc-value{color:#4caf7d}
.gsm-card.gc-orange .gc-value{color:#f5a623}
.gsm-card.gc-earned{background:#1a2a1a;border-color:#2a4a2a}
.gsm-card.gc-earned .gc-value{color:#4caf7d}
.gsm-card2{display:grid;gap:10px;margin-bottom:20px}
.gsm-card2.cols2{grid-template-columns:repeat(2,1fr)}
.gsm-card2.cols4{grid-template-columns:repeat(4,1fr)}
@media(max-width:600px){.gsm-card2.cols4{grid-template-columns:repeat(2,1fr)}}
.gsm-bar-wrap{margin-bottom:16px}
.gsm-bar-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.gsm-bar-label{font-size:11px;color:#8892a4;text-transform:uppercase;letter-spacing:1px}
.gsm-bar-status{font-size:11px;font-weight:700}
.gsm-bar-track{background:#1a2030;border-radius:4px;height:10px;position:relative}
.gsm-bar-fill{height:100%;border-radius:4px}
.gsm-bar-marker{position:absolute;top:-3px;width:2px;height:16px;background:#ffffff33;border-radius:1px}
.gsm-bar-foot{display:flex;justify-content:space-between;margin-top:3px}
.gsm-bar-foot span{font-size:10px;color:#5a6375}
.gsm-proj{background:#0d1117;border:2px solid #4caf7d;border-radius:10px;padding:18px;text-align:center;margin-top:16px;margin-bottom:28px}
.gsm-proj .gp-label{font-size:10px;color:#4caf7d;font-weight:700;text-transform:uppercase;letter-spacing:2px;margin-bottom:6px}
.gsm-proj .gp-value{font-size:38px;font-weight:900;color:#4caf7d}
.gsm-proj .gp-sub{font-size:11px;color:#5a6375;margin-top:4px}
.gsm-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.gsm-table{width:100%;border-collapse:collapse;font-size:13px}
.gsm-table th{background:#0d1117;color:#8892a4;font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:9px 10px;text-align:right;font-weight:600}
.gsm-table th:first-child{text-align:left}
.gsm-table td{padding:9px 10px;text-align:right;border-bottom:1px solid #181e2c}
.gsm-table td:first-child{text-align:left}
.gsm-table tr:hover td{background:#1a2030}
.gsm-table .gsm-me td{background:#1a2a1a;outline:1px solid #4caf7d}
.gsm-table .gsm-total td{background:#0d1117;border-top:2px solid #4caf7d;font-weight:900}
.gsm-note{font-size:10px;color:#5a6375;margin-top:8px}
#daily-msg{background:#12172a;border:1px solid #2a3040;border-left:4px solid #f5a623;border-radius:10px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:flex-start;gap:12px}
.dm-icon{font-size:22px;line-height:1;flex-shrink:0;margin-top:2px}
.dm-text{font-size:14px;color:#c8d0e0;line-height:1.6;font-style:italic}
.dm-text strong{color:#fff;font-style:normal}

.order-block{background:#0d1117;border:1px solid #2a3040;border-radius:8px;margin-bottom:12px;overflow:hidden}
.order-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#141820;flex-wrap:wrap;gap:6px}
.order-inv{font-size:12px;font-weight:800;color:#f5a623;margin-right:10px}
.order-ord{font-size:11px;color:#5a6375;margin-right:10px}
.order-date{font-size:11px;color:#8892a4}
.order-cust{font-size:12px;font-weight:700;color:#c8d0e0}
.order-notes{padding:5px 14px;background:#0f1420;font-size:10px;color:#6b7585;display:flex;flex-wrap:wrap;gap:8px}
.order-table{margin:0}
.order-table td,.order-table th{padding:5px 10px}
.order-totals{display:flex;flex-wrap:wrap;gap:12px;padding:8px 14px;background:#141820;border-top:1px solid #1e2435;font-size:11px;color:#8892a4}
.order-totals strong{color:#c8d0e0}
</style>
</head>

  const el=document.getElementById('bonus-section');
  if(!el)return;
  const bd=BONUS_DATA[repId];
  if(!bd||!bd.tiers.length){el.style.display='none';return;}
  // find current DBW month
  const today=new Date();today.setHours(0,0,0,0);
  let cur=null;
  for(const m of DBW_CAL){
    const s=new Date(m.s),e=new Date(m.e);
    s.setHours(0,0,0,0);e.setHours(0,0,0,0);
    if(today<=e){cur=m;if(today>=s)break;}  // take first month that hasn't ended; break early if we're inside it
  }
  if(!cur){el.style.display='none';return;}
  const s=new Date(cur.s),e=new Date(cur.e);
  s.setHours(0,0,0,0);e.setHours(0,0,0,0);
  const total=cur.d;
  let elapsed,remaining;
  if(today<s){elapsed=0;remaining=total;}
  else if(today>=e){elapsed=total;remaining=0;}
  else{
    const frac=(today-s)/(e-s);
    elapsed=Math.min(total-1,Math.round(frac*total));
    remaining=total-elapsed;
  }
  const pct=Math.min(100,Math.round((elapsed/total)*100));
  const colors=['#f5a623','#4caf7d','#4a9eff'];
  const labels=['LEVEL 1','LEVEL 2','TOP TIER'];
  let tierHtml='';
  bd.tiers.forEach((t,i)=>{
    const pace=Math.ceil(t.t/total);
    const paceRem=remaining>0?Math.ceil(t.t/remaining):null;
    const earn=fmt$(t.t*(t.p/100));
    const c=colors[i]||'#aaa';
    const paceStr=remaining>0&&remaining<total
      ?`From day 1: ${fmt$(pace)}/day &nbsp;|&nbsp; To hit from now: ${fmt$(paceRem)}/day`
      :`${fmt$(pace)}/day`;
    tierHtml+=`<div class="bonus-tier" style="border-left:4px solid ${c}">

      (inProg?
        '<div class="gc-value" style="color:#f5a623">'+fmt$(q.net)+'</div>'+
        '<div style="background:#1a2030;border-radius:3px;height:5px;margin:6px 0;overflow:hidden"><div style="background:#f5a623;width:'+pct+'%;height:100%;border-radius:3px"></div></div>'+
        '<div class="gc-sub">Need '+fmt$(toLow)+' for +$9K | '+fmt$(toHigh)+' for +$14K</div>'
      :
        '<div class="gc-value" style="color:#3a4255;font-size:16px">—</div>'+
        '<div class="gc-sub" style="color:#3a4255">+$9K at $1.25M | +$14K at $1.5M</div>'
      )+
    '</div>';
  }).join('');

  // ── MY PERSONAL INCOME CARDS ─────────────────────────────────────────────────
  const myPersonalHtml=
    '<div class="gsm-card gc-green">'+
      '<div class="gc-label">Commission YTD</div>'+
      '<div class="gc-value">'+fmt$(myComm)+'</div>'+
      '<div class="gc-sub">Proj EOY: '+fmt$(commPaced)+'</div>'+
    '</div>'+
    '<div class="gsm-card '+(myIndivBonus!=null?'gc-green':'')+'">'+
      '<div class="gc-label">Indiv Sales Bonus YTD</div>'+
      '<div class="gc-value" style="color:'+(myIndivBonus!=null?'#4caf7d':'#3a4255')+'">'+( myIndivBonus!=null?fmt$(myIndivBonus):'TBD')+'</div>'+
      '<div class="gc-sub">Submitted after month end</div>'+
    '</div>';

  // ── W784-ONLY: GUARANTEED INCOME ─────────────────────────────────────────────
  const salYTD=ppElapsed*SAL_PER_CHECK, guarYTD=ppElapsed*GUAR_PER_CHECK;
  const salEOY=PP_TOTAL*SAL_PER_CHECK, guarEOY=PP_TOTAL*GUAR_PER_CHECK;
  const guarHtml=repId==='W784'?
    '<div style="margin-bottom:20px">'+
      '<div class="gsm-title">📋 Guaranteed Income</div>'+
      '<div class="gsm-card2 cols2">'+
        '<div class="gsm-card gc-orange">'+
          '<div class="gc-label">Salary YTD</div>'+
          '<div class="gc-value">'+fmt$(salYTD)+'</div>'+
          '<div class="gc-sub">'+ppElapsed+' checks × $3,350 | EOY: '+fmt$(salEOY)+'</div>'+
        '</div>'+
        '<div class="gsm-card gc-orange">'+
          '<div class="gc-label">Guar. Bonus YTD</div>'+
          '<div class="gc-value">'+fmt$(guarYTD)+'</div>'+
          '<div class="gc-sub">'+ppElapsed+' checks × $1,350 | EOY: '+fmt$(guarEOY)+'</div>'+
        '</div>'+
      '</div>'+
    '</div>'
  :'';

  // ── PROJECTED TOTALS ─────────────────────────────────────────────────────────
  const qBonusProjected=Q_LOW_BONUS*4;
  const totalYTD=(repId==='W784'?salYTD+guarYTD:0)+qEarned+myComm+(myIndivBonus||0);
  const totalEOY=(repId==='W784'?salEOY+guarEOY:0)+qBonusProjected+commPaced+(myIndivBonus||0);
  const totalPacePct=totalEOY>0?Math.min(Math.round((totalYTD/totalEOY)*100),100):0;
  const yearPctNum=Math.round((DBW_DAYS_ELAPSED/DBW_DAYS_TOTAL)*100);
  const totalAhead=totalYTD/totalEOY>=DBW_DAYS_ELAPSED/DBW_DAYS_TOTAL;

  const projHtml=
    '<div class="gsm-proj">'+
      '<div class="gp-label">🎯 Projected 2026 Total Earnings</div>'+
      '<div class="gp-value">'+fmt$(totalEOY)+'</div>'+
      '<div class="gp-sub">'+
        (repId==='W784'?'Salary $'+salEOY.toLocaleString()+' + Guar $'+guarEOY.toLocaleString()+' + ':'')+
        'Q Bonuses $'+qBonusProjected.toLocaleString()+' (conservative 4×low) + Commission $'+Math.round(commPaced).toLocaleString()+
      '</div>'+
      '<div style="margin-top:12px;background:#1a2030;border-radius:4px;height:8px">'+
        '<div style="background:#4caf7d;width:'+totalPacePct+'%;height:100%;border-radius:4px"></div>'+
      '</div>'+
      '<div class="gsm-bar-foot" style="margin-top:4px">'+
        '<span>YTD: '+fmt$(totalYTD)+' ('+totalPacePct+'%)</span>'+
        '<span style="color:'+(totalAhead?'#4caf7d':'#f5a623')+'">'+(totalAhead?'▲ AHEAD':'▼ BEHIND')+' | Year '+yearPctNum+'% done</span>'+
      '</div>'+
    '</div>';

  // ── OFFICE PROFIT TABLE ───────────────────────────────────────────────────────
  const collByRep={};
  D.monthly.forEach(r=>{collByRep[r.rep_id]=(collByRep[r.rep_id]||0)+(r.collections||0);});
  let ptGross=0,ptCogs=0,ptComm=0,ptBonus=0;
  let rowsHtml='';
  D.ranked.forEach(rid=>{
    const r=D.roster[rid];
    const y=D.ytd[rid]||{};
    const c=D.comm_ytd[rid]||0;
    const bon=D.bonus_ytd&&D.bonus_ytd[rid]!=null?D.bonus_ytd[rid]:null;
    const gross=(y.sales||0),cogs=(y.cogs||0);
    const grossP=gross-cogs, netP=gross-cogs-c-(bon||0);
    ptGross+=gross;ptCogs+=cogs;ptComm+=c;ptBonus+=(bon||0);
    const isMe=rid===repId;
    rowsHtml+='<tr class="'+(isMe?'gsm-me':'')+'">'  +
      '<td style="font-weight:'+(isMe?900:600)+';color:'+(isMe?'#f5a623':'#e8eaf0')+'">'+r.name+(isMe?' ◀':'')+'</td>'+
      '<td>'+fmt$(gross)+'</td><td>'+fmt$(cogs)+'</td>'+
      '<td style="color:#4caf7d">'+fmt$(grossP)+'</td>'+
      '<td style="color:#4caf7d">'+fmt$(c)+'</td>'+
      '<td style="color:#f5a623">'+(bon!=null?fmt$(bon):'<span style="color:#5a6375">TBD</span>')+'</td>'+
      '<td style="color:#4caf7d;font-weight:800">'+fmt$(netP)+'</td>'+
    '</tr>';
  });
  const ptNetP=ptGross-ptCogs-ptComm-ptBonus;
  rowsHtml+='<tr class="gsm-total">'+
    '<td style="color:#f5a623">OFFICE TOTAL</td>'+
    '<td>'+fmt$(ptGross)+'</td><td>'+fmt$(ptCogs)+'</td>'+
    '<td style="color:#4caf7d">'+fmt$(ptGross-ptCogs)+'</td>'+
    '<td style="color:#4caf7d">'+fmt$(ptComm)+'</td>'+
    '<td style="color:#f5a623">'+(ptBonus>0?fmt$(ptBonus):'<span style="color:#5a6375">TBD</span>')+'</td>'+
    '<td style="color:#4caf7d;font-size:15px">'+fmt$(ptNetP)+'</td>'+
  '</tr>';

  // ── INJECT ───────────────────────────────────────────────────────────────────
  document.getElementById('gsm-section').innerHTML=
    '<div class="gsm-section">'+
      '<div class="gsm-main-title">🔒 My 2026 Earnings — GSM View</div>'+
      guarHtml+
      '<div class="gsm-title">🏆 Quarterly Manager Bonuses</div>'+
      '<div class="gsm-card2 cols4">'+qCardsHtml+'</div>'+
      '<div class="gsm-title">💰 My Personal Income</div>'+
      '<div class="gsm-card2 cols2">'+myPersonalHtml+'</div>'+
      '<div class="gsm-title">📈 Pace to End of Year</div>'+
      paceBar('YTD Net Sales Volume',netSales,salesPaced,'#f5a623')+
      paceBar('YTD Commission',myComm,commPaced,'#4caf7d')+
      projHtml+
      '<div style="padding-top:20px;border-top:1px solid #2a3040">'+
        '<div class="gsm-main-title">📊 Office Profit Breakdown — All Reps</div>'+
        '<div class="gsm-note" style="margin-bottom:12px">Gross Sales − COGS − Commission − Bonus = Net Profit</div>'+
        '<div class="gsm-table-wrap">'+
        '<table class="gsm-table">'+
          '<thead><tr>'+
            '<th>Rep</th><th>Gross Sales</th><th>COGS</th>'+
            '<th style="color:#4caf7d">Gross Profit</th>'+
            '<th style="color:#4caf7d">Commission</th>'+
            '<th style="color:#f5a623">Bonus</th>'+
            '<th style="color:#4caf7d;font-weight:900">Net Profit*</th>'+
          '</tr></thead>'+
          '<tbody>'+rowsHtml+'</tbody>'+
        '</table></div>'+
        '<div class="gsm-note">* Bonus TBD = submitted after month end closes</div>'+
      '</div>'+
    '</div>';
}
renderDailyMsg(repId);

} // end initDashboard
initDashboard(D);
</script>
</body>
</html>
