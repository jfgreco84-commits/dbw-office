name: card-guard

# Customer card data must never be published from this repo.
#  - check:   fails (and emails the owner) when a push carries card data; runs the guard tests.
#  - autofix: masks it and pushes the cleaned files, then rebuilds the site, so the
#             desktop automations can't keep card data on the site even on a PC without
#             the pre-commit hook (tools/hooks/pre-commit).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard tests
        run: python3 tools/card_guard_test.py
      - name: No card data in published files
        run: |
          git ls-files -z -- '*.html' '*.json' '*.js' '*.md' '*.csv' '*.txt' \
            | grep -zv '^tools/card_guard' \
            | xargs -0 python3 tools/card_guard.py --check

  autofix:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    concurrency:
      group: card-guard-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Mask card data and push the cleaned files
        id: fix
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          scan() { git ls-files -z -- '*.html' '*.json' '*.js' '*.md' '*.csv' '*.txt' | grep -zv '^tools/card_guard' | xargs -0 python3 tools/card_guard.py --check >/dev/null; }
          if scan; then echo "no card data"; echo "pushed=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          # The desktop automations push several commits a minute apart; let that burst finish.
          if [ "$BRANCH" = main ]; then sleep 90; fi
          git config user.name "card-guard"
          git config user.email "card-guard@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch -q origin "$BRANCH" && git reset -q --hard "origin/$BRANCH"
            if scan; then echo "already clean"; echo "pushed=no" >> "$GITHUB_OUTPUT"; exit 0; fi
            git ls-files -z -- '*.html' '*.json' '*.js' '*.md' '*.csv' '*.txt' | grep -zv '^tools/card_guard' \
              | xargs -0 python3 tools/card_guard.py --fix
            git commit -qam "card-guard: masked card data"
            if git push -q origin "HEAD:$BRANCH"; then echo "pushed=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep $((attempt * 20))
          done
          echo "card-guard: could not push the cleaned files"; exit 1
      - name: Rebuild the site from the cleaned commit
        if: steps.fix.outputs.pushed == 'yes' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request failed; the next push will deploy the cleaned files."
